name: Publish GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build static site folder
        run: |
          set -euxo pipefail
          ROOT="."
          rm -rf site
          mkdir -p site
          cp -R "${ROOT}/frontend" site/frontend
          mkdir -p site/data
          # Copy only small, web-friendly artifacts.
          cp -R "${ROOT}/data/"* site/data/ || true
          # Convenience redirect so the Pages root works.
          cat > site/index.html <<'EOF'
          <!doctype html>
          <meta charset="utf-8" />
          <meta http-equiv="refresh" content="0; url=./frontend/" />
          <title>Chicago LST</title>
          <p>Redirecting…</p>
          EOF

      - name: Bake static ECOSTRESS XYZ tiles
        continue-on-error: true
        run: |
          set -euxo pipefail
          python3 -m pip install --user "numpy>=1.26,<2" "rasterio>=1.3,<1.5"
          COG_URL="https://pub-35e731c3513942bd8c03f959efee69d1.r2.dev/ecostress_il_lst_70m_latest.cog.tif"
          python3 analysis/26_bake_ecostress_xyz.py \
            --cog "/vsicurl/${COG_URL}" \
            --out-dir site/data/tiles/ecostress \
            --min-zoom 6 \
            --max-zoom 10 \
            --meta-json site/data/ecostress_highres_latest.json \
            --public-tiles-url "../data/tiles/ecostress/{z}/{x}/{y}.png" \
            --scene-time "2025-07-31T18:05:13Z"

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

